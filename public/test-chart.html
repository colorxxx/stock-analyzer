<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chart Touch Test</title>
<script src="https://unpkg.com/lightweight-charts@4.2.3/dist/lightweight-charts.standalone.production.js"></script>
</head>
<body style="margin:0;padding:20px;background:#111">
<h3 style="color:white">Touch Test - Pinch zoom &amp; tap test</h3>
<div id="log" style="color:#0f0;font-size:12px;margin-bottom:10px"></div>
<div id="chart" style="width:100%;height:300px"></div>
<script>
const log = document.getElementById('log');
function addLog(msg) { log.textContent = msg + '\n' + log.textContent; }

const chart = LightweightCharts.createChart(document.getElementById('chart'), {
  width: window.innerWidth - 40,
  height: 300,
  layout: { background: { type: 'solid', color: '#1a1a2e' }, textColor: '#ccc' },
  handleScroll: { vertTouchDrag: true, horzTouchDrag: true, mouseWheel: true, pressedMouseMove: true },
  handleScale: { mouseWheel: true, pinch: true, axisPressedMouseMove: { time: true, price: true } },
});

const series = chart.addCandlestickSeries();
const data = [];
let t = new Date('2024-01-01').getTime() / 1000;
let price = 100;
for (let i = 0; i < 200; i++) {
  const o = price + (Math.random() - 0.5) * 3;
  const c = o + (Math.random() - 0.5) * 4;
  const h = Math.max(o, c) + Math.random() * 2;
  const l = Math.min(o, c) - Math.random() * 2;
  data.push({ time: t, open: o, high: h, low: l, close: c });
  price = c;
  t += 86400;
}
series.setData(data);
chart.timeScale().fitContent();

chart.subscribeClick((param) => {
  addLog('CLICK: time=' + (param.time || 'none') + ' point=' + JSON.stringify(param.point));
});

chart.subscribeCrosshairMove((param) => {
  if (param.time) {
    document.getElementById('log').dataset.lastTime = param.time;
  }
});

addLog('Chart ready. Try pinch zoom and tap on candles.');
</script>
</body>
</html>
